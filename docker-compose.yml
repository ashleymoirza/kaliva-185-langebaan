    #         memory: 1G

  # ─────────────────────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: kaliva185-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/kaliva185.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - ./public:/var/www/kaliva185/public:ro
      - ./nginx/www:/var/www/letsencrypt:ro
    networks:
      - kaliva-external
    # depends_on:
    #   - app-staging
    #   - app-production
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ─────────────────────────────────────────────────────────────
  # Worker (Background Jobs)
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: kaliva185-worker
    restart: unless-stopped
    command: ["npx", "tsx", "lib/queue/worker-entry.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kaliva:${POSTGRES_PASSWORD}@postgres:5432/kaliva185_prod?schema=public
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://ollama:11434
    env_file:
      - .env.production
    networks:
      - kaliva-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─────────────────────────────────────────────────────────────
  # pgAdmin (Database Management) - Optional
  # ─────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kaliva185-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kaliva185.duckdns.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - kaliva-external
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ─────────────────────────────────────────────────────────────
  # Redis Commander (Redis Management) - Optional
  # ─────────────────────────────────────────────────────────────
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: kaliva185-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379"
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD}
    networks:
      - kaliva-external
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

networks:
  kaliva-internal:
    driver: bridge
    internal: true  # No external access
  kaliva-external:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  pgadmin_data:
    driver: local