# Nginx configuration for Kaliva 185 Langebaan
# Staging: staging.kaliva185.duckdns.org -> 105.29.227.42
# Production: kaliva185.duckdns.org -> 105.29.227.42

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

# Upstream for Next.js application
upstream kaliva_nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name staging.kaliva185.duckdns.org kaliva185.duckdns.org www.kaliva185.duckdns.org;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server for Staging
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.kaliva185.duckdns.org;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/staging.kaliva185.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.kaliva185.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content Security Policy (Next.js manages its own CSP via headers())
    # Nginx CSP as fallback
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za https://checkout.stripe.com https://api-sandbox.ozow.com https://api.ozow.com; script-src 'self' 'unsafe-inline' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.facebook.com https://web.facebook.com https://*.fbcdn.net https://maps.gstatic.com https://maps.googleapis.com; font-src 'self' data:; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://api.stripe.com https://www.payfast.co.za https://api-sandbox.ozow.com https://api.ozow.com; frame-src 'self' https://www.google.com https://maps.google.com https://checkout.stripe.com; upgrade-insecure-requests;" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Static files - served directly by Nginx
    location /_next/static/ {
        alias /var/www/kaliva185/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /_next/data/ {
        alias /var/www/kaliva185/.next/data/;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Public assets
    location /images/ {
        alias /var/www/kaliva185/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /favicon.ico {
        alias /var/www/kaliva185/public/favicon.ico;
        expires 365d;
        access_log off;
    }

    location /robots.txt {
        alias /var/www/kaliva185/public/robots.txt;
        expires 1d;
        access_log off;
    }

    location /sitemap.xml {
        alias /var/www/kaliva185/public/sitemap.xml;
        expires 1d;
        access_log off;
    }

    # Health check endpoint (no rate limiting)
    location /api/health {
        proxy_pass http://kaliva_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # Expose rate limit headers
        limit_req_dry_run off;

        # Stricter rate limiting for auth endpoints
        location ~ ^/api/auth/(login|register) {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
        }

        # Webhook endpoints - allow higher burst for payment callbacks
        location ~ ^/api/payments/(ozow|payfast|stripe)/notify {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;
        }

        proxy_pass http://kaliva_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Expose rate limit headers to client
        add_header X-RateLimit-Limit $limit_req_zone_api_limit_rate always;
        add_header X-RateLimit-Remaining $limit_req_zone_api_limit_rate always;
        add_header X-RateLimit-Reset $limit_req_zone_api_limit_burst always;

        # Timeouts for API calls (Ollama can take time)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # WebSocket support for SSE/streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache off;
    }

    # Admin routes with stricter rate limiting
    location /admin/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://kaliva_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Main application - all other routes
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://kaliva_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache off;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Logging
    access_log /var/log/nginx/kaliva185-staging-access.log combined;
    error_log /var/log/nginx/kaliva185-staging-error.log warn;
}

