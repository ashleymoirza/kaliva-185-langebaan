          properties:
            self:
              type: string
              format: uri
              description: The unique URI to this resource.
              example: https://one.ozow.com/v1/settlements/497f6eca-6276-4993-bfeb-53cbbbba6f08
            lineItems:
              type: string
              format: uri
              example: https://one.ozow.com/v1/settlements/497f6eca-6276-4993-bfeb-53cbbbba6f08/lineitems
