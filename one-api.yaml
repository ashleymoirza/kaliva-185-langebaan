                title: Conflict
                detail: Idempotency key and request data do not match a previous request.
                source:
                  pointer: null
                  parameter: null
                  header: Idempotency-Key
                meta:
                  correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      headers:
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
          description: The correlation id for the request that was processed.
    InternalServerError:
