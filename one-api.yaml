components:
  schemas:
    WebhookEventData:
      title: WebhookEventData
      x-tags:
        - webhooks
      type: object
      description: >-
        The `data` of a delivery whose subscription asked for `thin`, which is
        every subscription event and the default for the rest.
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
          description: >-
            What the event is about: the transaction, the refund, or the
            subscription.
        status:
          type: string
          description: >-
            The outcome. The values differ per event: see the event's own
            description.
        reason:
          type:
            - string
            - "null"
          example: "The payer cancelled at their bank"
          description: The status message, when there is one to give.
    TransactionCompleteFullData:
      title: TransactionCompleteFullData
      x-tags:
        - webhooks
      type: object
      description: >-
        The `data` of a `transaction.complete` delivery whose subscription asked
        for `full`. It is the field set the Payments API posts to a notify URL,
        so a handler written for that notification reads this unchanged. Every
        value is a string, including the amount and the flags.
      required:
        - SiteCode
        - TransactionId
        - TransactionReference
        - Amount
        - Status
        - Optional1
        - Optional2
        - Optional3
        - Optional4
        - Optional5
        - CurrencyCode
        - IsTest
        - StatusMessage
        - Hash
      properties:
        SiteCode:
          type: string
          description: The site the transaction was created against.
        TransactionId:
          type: string
          format: uuid
          description: The transaction identifier.
        TransactionReference:
          type: string
          description: Your own reference for the transaction.
        Amount:
          type: string
          description: The amount, to two decimal places, with a full stop as the separator.
        Status:
          type: string
          enum:
            - Successful
            - Incomplete
            - Pending
            - Error
          description: >-
            The mapped status, the same four values the `thin` payload carries.
        Optional1:
          type: string
          description: Your first optional field, empty when it was not set.
        Optional2:
          type: string
          description: Your second optional field, empty when it was not set.
        Optional3:
          type: string
          description: Your third optional field, empty when it was not set.
        Optional4:
          type: string
          description: Your fourth optional field, empty when it was not set.
        Optional5:
          type: string
          description: Your fifth optional field, empty when it was not set.
        CurrencyCode:
          type: string
          description: The ISO 4217 currency code.
        IsTest:
          type: string
          enum:
            - "True"
            - "False"
          description: Whether the transaction was a test one.
        StatusMessage:
          type: string
          description: The status detail, empty when there is none.
        Hash:
          type: string
          description: >-
            The check hash over the field set, the same one the Payments API
            notification carries. Verify the Svix signature rather than this:
            the signature covers the whole delivery.
        SubStatus:
          type: string
          description: Present only when the transaction has a sub-status.
        SubStatusDescription:
          type: string
          description: Present only when the sub-status has a description.
        MaskedAccountNumber:
          type: string
          description: >-
            The payer's masked account number. Present only when your site is
            configured to receive it and the transaction is complete, pending or
            under investigation.
        BankName:
          type: string
          description: >-
            The payer's bank. Absent when your site is configured for legacy
            fields only.
        SmartIndicators:
          type: string
          description: >-
            The risk indicators. Present only on a complete transaction that has
            them, and never when your site is configured for legacy fields only.
        BankId:
          type: string
          description: >-
            Present only on a live transaction when your site is configured to
            receive banking details.
        AccountNumber:
          type: string
          description: >-
            Present only on a live transaction when your site is configured to
            receive banking details.
        PublicRecipientName:
          type: string
          description: >-
            Present only on a live transaction when your site is configured to
            receive banking details.
    RefundCompleteFullData:
      title: RefundCompleteFullData
      x-tags:
        - webhooks
      type: object
      description: >-
        The `data` of a `refund.complete` delivery whose subscription asked for
        `full`. Every value is a string. `Status` here is not the `thin`
        payload's `status`: the `full` payload carries the refund's own status
        unmapped, so it has two values the `thin` one folds away.
      required:
        - RefundId
        - TransactionId
        - CurrencyCode
        - Amount
        - Status
        - BankName
        - AccountNumber
        - StatusMessage
        - Hash
      properties:
        RefundId:
          type: string
          format: uuid
          description: The refund identifier.
        TransactionId:
          type: string
          format: uuid
          description: The transaction the refund was raised against.
        CurrencyCode:
          type: string
          description: The ISO 4217 currency code.
        Amount:
          type: string
          description: The amount, to two decimal places, with a full stop as the separator.
        Status:
          type: string
          enum:
            - Pending
            - Complete
            - Submitted
            - Failed
            - Cancelled
            - Returned
            - Invalid
            - PendingInvestigation
            - Error
          description: >-
            The refund's own status, unmapped. `PendingInvestigation` and
            `Error` reach a `full` subscriber as themselves, where a `thin`
            subscriber sees `Pending` and `Failed` in their place.
        BankName:
          type: string
          description: The bank the refund was paid to.
        AccountNumber:
          type: string
          description: The account the refund was paid to.
        StatusMessage:
          type: string
          description: The status detail, empty when there is none.
        Hash:
          type: string
          description: >-
            The check hash over the field set. Verify the Svix signature rather
            than this: the signature covers the whole delivery.
    WebhookEnvelope:
      title: WebhookEnvelope
      x-tags:
        - webhooks
      type: object
      description: >-
        Every delivery has this shape. `data` is what the subscription's message
        type decides.
      required:
        - type
        - timestamp
        - data
      properties:
        type:
          type: string
          description: The event type the subscription was created for.
        timestamp:
          type: string
          format: date-time
          description: When the event was raised.
        data:
          description: >-
            What the subscription's message type decides. A `thin` subscription
            receives `WebhookEventData`, which is every event's default and the
            only form the subscription events support. A `full` subscription to
            `transaction.complete` receives `TransactionCompleteFullData`, and
            to `refund.complete`, `RefundCompleteFullData`. A `full`
            subscription to any of the subscription events receives nothing at
            all.
          anyOf:
            - $ref: "#/components/schemas/WebhookEventData"
            - $ref: "#/components/schemas/TransactionCompleteFullData"
            - $ref: "#/components/schemas/RefundCompleteFullData"
    AbsaPay:
      title: AbsaPay
      type: object
      required:
        - accessAccount
        - callbackUrl
      properties:
        accessAccount:
          type: string
          description: The ABSA access account number for the payer.
          maxLength: 16
        callbackUrl:
