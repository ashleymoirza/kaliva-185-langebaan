        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unexpected:
              summary: The request failed on the Ozow side
              value:
                id: 9e0d5a83-6b24-4c19-8f7a-2d1b3e6c0a97
                links: null
                code: InternalServerError
                title: Internal Server Error
                detail: Error occurred while processing request.
                source:
                  pointer: /data
                  parameter: null
                  header: null
                meta:
                  correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      headers:
        X-Correlation-ID:
          schema:
            type: string
          description: The correlation id for the request that was processed.
    BadGateway:
      description:
        Bad Gateway. An upstream payment service was unreachable or returned an error; the
        request was not completed. Safe to retry shortly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            upstreamDown:
              summary: An upstream payment service could not be reached
              value:
                id: 6c3a1f95-8d07-4e2b-a94c-5f0b7d2e8134
                links: null
                code: BadGateway
                title: Bad Gateway
                detail: The upstream service is currently unavailable. Please try again shortly.
                source: null
                meta:
                  correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      headers:
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
          description: The correlation id for the request that was processed.
