        - isSensitive
      properties:
        maxLength:
          type: integer
          minimum: 1
          description: The maximum length of the text allowed.
          example: 10
        isOptional:
          type: boolean
          description: Whether or not the field is optional.
        isSensitive:
          type: boolean
          description:
            Whether or not the field is sensitive, if marked as sensitive the input on the end
            user side should be masked.
      x-tags:
        - payments
    InputResponse:
      title: InputResponse
      type: object
      x-tags:
        - payments
      required:
        - transactionId
        - paymentStep
        - pageTitle
        - pageInstructions
        - pageActionText
        - displayType
      properties:
        transactionId:
          type: string
          format: uuid
          description: The transaction id of the payment being processed.
          example: 5ecaafc2-354f-47d9-822d-d0bd8b77eab3
        paymentStep:
          type: string
          description: The name of the payment step being performed.
          example: Login
        pageTitle:
          type: string
          description:
            The title of the page, this will be a user friendly message and can be displayed
            to the end user.
          example: Login Details
        pageInstructions:
          type: string
          description:
            Instructions for the end user to perform, this will be a user friendly message
            and can be displayed to the end user.
          example: Log in using your internet banking profile.
        pageActionText:
          type: string
          description:
            The action type, this could typically be used as the text for a button or link.
            This will be a user friendly message and can be displayed to the end user.
          example: Login
        displayType:
          enum:
            - form
            - prompt
            - busy
          description:
            The display type which indicates what sort of action should be taken. `form` will
            require asking the user for input, `prompt` will require instructing the user to perform an
            action (e.g. accept a push message) and `busy` will require asking the user to wait.
        inputFields:
          type: array
          description:
            If the object is of the `form` display type the input fields the user would need
            to complete will be returned in this array.
          items:
            $ref: "#/components/schemas/InputField"
    PaginationLinks:
      title: PaginationLinks
      type: object
      description:
        Standard [JSON API pagination links](https://jsonapi.org/format/#fetching-pagination).
        Each link repeats the query that produced the collection and carries its own `limit`
        and `offset`. Follow the link rather than building the next URI. The example below is
        the second of three pages.
      x-tags:
        - common
      example:
        self: https://one.ozow.com/v1/payments?siteCode=SITE-001&fromDate=2026-01-01&toDate=2026-01-31&limit=50&offset=50
        first: https://one.ozow.com/v1/payments?siteCode=SITE-001&fromDate=2026-01-01&toDate=2026-01-31&limit=50&offset=0
        last: https://one.ozow.com/v1/payments?siteCode=SITE-001&fromDate=2026-01-01&toDate=2026-01-31&limit=50&offset=100
        prev: https://one.ozow.com/v1/payments?siteCode=SITE-001&fromDate=2026-01-01&toDate=2026-01-31&limit=50&offset=0
        next: https://one.ozow.com/v1/payments?siteCode=SITE-001&fromDate=2026-01-01&toDate=2026-01-31&limit=50&offset=100
      properties:
        self:
          type: string
          format: uri
          description: The current page of data.
        first:
          type: string
          format: uri
          description: The first page of data.
        last:
          type:
            - string
            - "null"
          format: uri
          description: The last page of data. Null when the whole collection fits on one page.
        prev:
          type:
            - string
            - "null"
          format: uri
          description: The previous page of data. Null on the first page.
        next:
          type:
            - string
            - "null"
          format: uri
          description: The next page of data. Null on the last page.
    PaginationMeta:
      title: PaginationMeta
      type: object
      x-tags:
        - payments
      required:
        - totalPages
        - totalItems
      properties:
        totalPages:
          type: integer
          description: The total number of pages available.
        totalItems:
          type: integer
          description: The total number of items available.
    Payer:
      title: Payer
      type: object
      x-tags:
        - payments
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "PAYER-001"
          description: The merchant identifier for the payer.
          maxLength: 50
        name:
          type: string
          maxLength: 200
          example: Firstname Lastname
        identity:
          $ref: "#/components/schemas/Identification"
          description: The identity of a payer.  In high risk cases this information is required.
        cellphone:
          type: string
          maxLength: 15
          description: The cellphone number for the payer.
          example: "+27821234567"
        email:
          type: string
          format: email
          description: The email address of the payer.
          example: a@example.com
    PaymentRequest:
      title: PaymentRequest
      type: object
      x-tags:
        - payments
      required:
        - siteCode
        - amount
        - merchantReference
        - expireAt
      properties:
        siteCode:
          type: string
          maxLength: 50
          description:
            The merchant site code in use for this payment. Site codes are available on the
            Ozow dashboard.
          example: SITE-001
        region:
          type: string
          maxLength: 2
          minLength: 2
          example: ZA
          description:
            "ISO 3166-Alpha-2 code for the originating country of the payment.\r\n\r\nMust\
            \ be \"ZA\" for South Africa.  \r\n\r\nIf region is not specified IP geolocation will be used\
            \ to determine the applicable region."
        amount:
          $ref: "#/components/schemas/Amount"
          description: The currency and amount of the payment request.
        variableAmount:
          $ref: "#/components/schemas/VariableAmount"
          description:
            If the payment amount can be changed by the payer, the variable amounts need to
            be passed in.
        merchantReference:
          type: string
          description: >-
            The merchant's reference for the transaction. It is pre-populated in
            the payer's own reference field at their bank, shortened by banks
            that limit it, so it is not an internal-only value.
          maxLength: 50
          example: "12345-abcde"
        beneficiaryReference:
          type: string
          description: >-
            The reference that appears on the merchant's bank statement for the
            payment. Letters and numbers only. Rejected as missing unless the
            site is configured to let the payer supply the reference. A site
            prefix, where one is configured, counts towards the 20 characters.
          example: ONLINESHOP002
          pattern: ^[A-Za-z0-9]*$
          maxLength: 20
        payerReference:
          type: string
          example: "12345-abcde"
          maxLength: 20
        payer:
          $ref: "#/components/schemas/Payer"
          description: Information on the payer used for identification and fraud purposes.
        returnUrl:
          type: string
          format: uri
          description:
            The URI that Ozow needs to redirect back to once the payment has reached a
            conclusion.
            Must be reachable from the internet. `localhost` is rejected with a 403, so a
            local integration needs a tunnel rather than the address the browser uses.
        notifyUrl:
          type: string
          format: uri
          description:
            Optional notify URL to send notifications of the status of the payment. The recommendation
            is to use webhooks instead of this method which are configurable via the webhooks endpoints
            of the API or via the Ozow Dashboard.
            Must be reachable from the internet. `localhost` is rejected with a 403, so a
            local integration needs a tunnel rather than the address the browser uses.
        expireAt:
          type: string
          format: date-time
          description:
            The date and time the payment request should expire at and make the payment link
            unusable
          example: "2035-06-30T17:00:00Z"
        institutionId:
          type: string
          format: uuid
          description:
            The institution to send the payer straight to, skipping the payment method
            selection screen. The identifier for each payment method is on that method's
            page under Payment products.
    PaymentStatus:
      title: PaymentStatus
      enum:
        - Created
        - Expired
      x-tags:
        - payments
      description: Payment Status Enumerator
    Transaction:
      title: Transaction
      type: object
      x-tags:
        - transactions
      required:
        - id
        - merchantReference
        - siteCode
        - institution
        - status
        - createdDate
      properties:
        links:
          $ref: "#/components/schemas/TransactionLinks"
        id:
          type: string
          format: uuid
          description: The transaction id of the payment.
          example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
        amount:
          $ref: "#/components/schemas/Amount"
          description: The amount that was requested.
        merchantReference:
          type: string
          description: The merchant's reference for the transaction.
          maxLength: 50
          example: "12345-abcde"
        siteCode:
          type: string
          maxLength: 50
          description: The merchant site code in use for this payment.
          example: SITE-001
        institution:
          type: string
          description: The institution for the transaction.
          example: First National Bank
        status:
          $ref: "#/components/schemas/TransactionStatus"
          description: The status of the transaction.
        reason:
          type: string
          example: "The payer cancelled at their bank"
          description: Payment status reason.
        createdDate:
          type: string
          format: date-time
          description: The date the transaction was created.
          example: "2026-01-15T09:30:00Z"
        completedDate:
          type: string
          format: date-time
          description: The date the transaction was completed.
          example: "2026-01-15T09:32:47Z"
    TransactionLinks:
      title: TransactionLinks
      type: object
      x-tags:
        - transactions
      required:
        - self
      properties:
        self:
          type: string
          format: uri
          example: https://one.ozow.com/v1/transactions/497f6eca-6276-4993-bfeb-53cbbbba6f08
          description: The unique URI for this resource.
        refund:
          type: string
          format: uri
          example: https://one.ozow.com/v1/transactions/497f6eca-6276-4993-bfeb-53cbbbba6f08/refunds
          description: The refund operation for this transaction.  This is a `POST` operation.
    TransactionStatus:
      title: TransactionStatus
      enum:
        - Incomplete
        - Successful
        - Error
        - Pending
        - Refunded
      description: >-
        The transaction's status. `Error` covers every unsuccessful outcome,
        and `reason` carries the detail.
      x-tags:
        - transactions
    VariableAmount:
      title: VariableAmount
      type: object
      x-tags:
        - payments
      required:
        - minimumValue
        - maximumValue
      properties:
        minimumValue:
          type: number
          format: float
          minimum: 0.01
          description: The minimum amount.
          example: 10
        maximumValue:
          type: number
          format: float
          minimum: 0.01
          description: The maximum amount.
          example: 50
  securitySchemes:
    Authentication:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://one.ozow.com/v1/token
          refreshUrl: ""
          scopes:
            payments:
              Allows for all payment and transaction functionality, such as retrieving data and
              making payment requests.
            payouts: Allows for all payout specific functionality.
            refunds: Allows for initiating refunds and retrieving refund data.
            settlements: Allows for retrieving settlement information.
            subscriptions: Allows for creating and managing recurring payment subscriptions.
            webhooks: Allows for management of webhook endpoints.
  examples: {}
  parameters:
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      schema:
        type: string
      description: The idempotency key for this request, as described in the [IETF draft](https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/). Sending one is optional, but recommended.
      example: YOUR_UNIQUE_KEY
    region:
      name: region
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 2
      description:
        The applicable region identifier in [ISO 3166-Alpha-2](https://www.iso.org/obp/ui/#search)
        format.
      example: ZA
    X-Forwarded-For:
      name: X-Forwarded-For
      in: header
      required: false
      schema:
        type: string
        format: ipv4
      description: The IP address of the end-consumer.
    limit:
      name: limit
      in: query
      schema:
        type: integer
        maximum: 50
        minimum: 1
        default: 50
      description: The maximum number of items to return.
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minLength: 0
        minimum: 0
        format: int32
        default: 0
      description: The number of items to discard in this paging operation.
    fromDate:
      name: fromDate
      in: query
      schema:
        type: string
        format: date
      description:
        The date from which to filter, inclusive. Whole days only, so any time sent with it is
        discarded.
      example: "2026-01-15"
      required: true
    toDate:
      name: toDate
      in: query
      required: true
      schema:
        type: string
        format: date
      description:
        The date to filter up to, inclusive. Whole days only, so any time sent with it is
        discarded.
      example: "2026-01-31"
    siteCode:
      name: siteCode
      in: query
      required: false
      schema:
        type: string
      description: The merchant site code.
      example: SITE-001
    X-Correlation-ID:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description:
        Optional correlation id for the request, if not supplied a new one will be generated
        and passed onto all underlying requests and returned as a header.
    siteCode-required:
      name: siteCode
      in: query
      required: true
      schema:
        type: string
      description: The merchant site code.
      example: SITE-001
  responses:
    Unauthorised:
      description: Unauthorised.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingToken:
              summary: No usable access token on the request
              value:
                id: 1cecc2b7-1c29-418a-b26a-bf7546926083
                links:
                  about: https://ozow.stoplight.io/docs/one-api/zi18vomr0jm8c-generate-authentication-token
                  type: https://tools.ietf.org/html/rfc7235#section-3.1
                code: Unauthorized
                title: Unauthorized Request
                detail: Authorization header is missing or invalid.
                source:
                  pointer: null
                  parameter: null
                  header: Authorization
                meta: null
      headers:
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
          description: The correlation id for the request that was processed.
    BadRequest:
      description: Bad Request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            validationFailed:
              summary: A field in the request body did not validate
              value:
                id: 3a6c9e01-5f2b-4d8a-9c47-1e0b7d5a2f83
                links: null
                code: BadRequest
                title: Bad Request
                detail: "amount: Amount must be greater than 0"
                source:
                  pointer: /amount
                  parameter: null
                  header: null
                meta:
                  correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      headers:
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
          description: The correlation id for the request that was processed.
    NotFound:
      description:
        Not found.  The item with the specified identifier could not be found, or this resource
        is not allowed for the resource identifier.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unknownId:
              summary: No resource with that identifier
              value:
                id: 5b9e3c17-4a8d-42f0-9e61-3c7b0f2a8d15
                links: null
                code: NotFound
                title: Not Found
                detail: The requested resource was not found.
                source:
                  pointer: /data
                  parameter: /v1/payments/497f6eca-6276-4993-bfeb-53cbbbba6f08
                  header: null
                meta:
                  correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      headers:
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
          description: The correlation id for the request that was processed.
    Forbidden:
      description: Forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            scopeMissing:
              summary: The token is valid but lacks the scope the operation needs
              value:
                id: c47a2e08-9b31-4f6d-85a0-7e2c1d9f3b56
                links:
                  about: https://ozow.stoplight.io/docs/one-api/zi18vomr0jm8c-generate-authentication-token
                  type: https://tools.ietf.org/html/rfc7235#section-3.1
                code: Forbidden
                title: Forbidden Request
                detail:
                  Request is forbidden, most likely scope does not match required scope to perform
                  requested action.
                source:
                  pointer: null
                  parameter: null
                  header: Authorization
                meta:
                  correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
      headers:
        X-Correlation-ID:
          schema:
            type: string
            format: uuid
          description: The correlation id for the request that was processed.
    Conflict:
      description: Conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
