      x-tags:
        - transactions
      required:
        - paymentRequest
      properties:
        paymentRequest:
          $ref: "#/components/schemas/PaymentRequest"
          description: The payment request details.
        paymentDetail:
          $ref: "#/components/schemas/PaymentDetail"
    Voucher:
      title: Voucher
      type: object
      required:
        - mobileNumber
        - voucherPin
        - callbackUrl
      properties:
        mobileNumber:
          type: string
          description: The mobile number of the payer.
          maxLength: 10
          example: "0821234567"
        voucherPin:
          type: string
          description: The pin code for the voucher.
          maxLength: 20
        callbackUrl:
          type: string
          description:
            "The URI to callback once the step has been completed. The callback URI will receive
            a `POST` request with a `InputResponse` model indicating what step is required next.

            "
      x-tags:
        - transactions
    WebhookMessageStatus:
      title: WebhookMessageStatus
      type: object
      x-tags:
        - webhooks
      required:
        - id
        - messageId
        - url
        - response
        - responseStatusCode
        - timestamp
      properties:
        id:
          type: string
          description: The unique id of this message attempt.
          maxLength: 50
          example: atmpt_2hEgZphGleUObRPVST5U5c0dtnw
        messageId:
          type: string
          description: The unique id of the message.
          maxLength: 50
          example: msg_2hEgZpemgIY1t1RiTOuVGsfZPBs
        url:
          type: string
          format: uri
          description: The URI of the webhook receiver.
          example: https://merchant.example.com/ozow/webhooks
        response:
          type: string
          description: Description of the response from the webhook receiver.
          example: OK
        responseStatusCode:
          type: integer
          description: The HTTP status code of the response from the webhook receiver.
          example: 200
        timestamp:
          type: string
          format: date-time
          description: The timestamp of the event.
    WebhookResponse:
      title: WebhookResponse
      type: object
      x-tags:
        - webhooks
      required:
        - id
        - endpoint
        - eventType
        - messageType
      properties:
        id:
          type: string
          description: The unique identifier of the webhook.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa2"
          format: uuid
        endpoint:
          type: string
          format: uri
          description: The uri of the webhook receiver.
        eventType:
          enum:
            - transaction.complete
            - refund.complete
          description: The type of event the webhook subscribes to.
        messageType:
          enum:
            - thin
            - full
          description:
            Defaults to `thin`. Specify `full` to receive a larger payload with as much detail
            as possible.
    WebhookRequest:
      title: WebhookRequest
      type: object
      x-tags:
        - webhooks
      required:
        - endpoint
        - eventType
      properties:
        endpoint:
          type: string
          format: uri
          description: The uri of the webhook receiver.
            Must be reachable from the internet. `localhost` is rejected with a 403, so a
            local integration needs a tunnel rather than the address the browser uses.
        eventType:
          enum:
            - transaction.complete
            - refund.complete
          description: The type of event the webhook subscribes to.
        messageType:
          enum:
            - thin
            - full
          description:
            Defaults to `thin`. Specify `full` to receive a larger payload with as much detail
            as possible.
    WebhookSecretResponse:
      title: WebhookSecretResponse
      type: object
      x-tags:
        - webhooks
      required:
        - secret
      properties:
        secret:
          type: string
          description: The secret key of the webhook to be used when validating the webhook signature.
    CreateSubscriptionRequest:
      title: CreateSubscriptionRequest
      type: object
      description:
        The details required to create a recurring payment subscription. The customer authorises
        an amount band (see `amountConstraints`) on the hosted page returned in `redirectUrl`; charges
        are taken on the schedule defined by `frequency`, `firstPaymentDate` and `occurrences`.
      x-tags:
        - subscriptions
      required:
        - siteCode
        - amount
        - amountConstraints
        - description
        - merchantReference
        - bankReference
        - frequency
        - firstPaymentDate
        - occurrences
      properties:
        siteCode:
          type: string
          maxLength: 50
          description: The site code the subscription belongs to.
          example: ABC-123456789
        amount:
          $ref: "#/components/schemas/Amount"
          description:
            The recurring charge amount. Must be `ZAR` and fall within the authorised band
            `[amountConstraints.min, amountConstraints.max]`.
        amountConstraints:
          $ref: "#/components/schemas/AmountConstraints"
          description: The per-payment authorisation band the customer approves.
        payableNow:
          $ref: "#/components/schemas/PayableNow"
          description: An optional once-off charge taken at sign-up. This charge is not bound by `amountConstraints`.
        identity:
          type: object
          description:
            "An optional customer identifier used for matching. Treated as personal information:
            it is accepted on the request but is never returned on any response (POPIA data minimisation)."
          required:
            - type
            - country
            - identifier
          properties:
            type:
              type: string
              enum:
                - said
                - passport
                - registration
                - cellphone
              description: The type of identification for the customer.
            country:
              type: string
              minLength: 2
              maxLength: 2
              description: The ISO 3166 alpha-2 code for the country of identification.
              example: ZA
            identifier:
              type: string
              example: "0000000000000"
              maxLength: 20
              description: The identifier value for the given identity type.
        description:
          type: string
          maxLength: 20
          description: A short description of the subscription.
          example: Monthly plan
        merchantReference:
          type: string
          maxLength: 50
          pattern: ^\S+$
          description: Your unique reference for the subscription. Must not contain spaces.
          example: SUB-0001
        bankReference:
          type: string
          maxLength: 20
          pattern: ^[a-zA-Z0-9]+$
          description: >-
            The reference that appears on the merchant's bank statement for each
            payment in the subscription. Letters and numbers only. A site prefix,
            where one is configured, counts towards the 20 characters.
          example: MyStore
        frequency:
          $ref: "#/components/schemas/SubscriptionFrequency"
        firstPaymentDate:
          type: string
          format: date
          description: The date of the first scheduled charge. Must be today or a future date.
          example: "2035-07-01"
        occurrences:
          type: integer
          minimum: 1
          maximum: 120
          description: The total number of scheduled charges over the life of the subscription.
          example: 12
        paymentMethod:
          type: string
          enum:
            - capitec
          description:
            Optional. The payment method (rail) used to collect charges. Defaults to `capitec`
            when omitted, which is currently the only supported method. Not returned on responses.
          example: capitec
    AmountConstraints:
      title: AmountConstraints
      type: object
      description:
        The per-payment authorisation band the customer approves. `min` and `max` are whole-Rand
        `ZAR` amounts (no cents).
      x-tags:
        - subscriptions
      required:
        - min
        - max
      properties:
        min:
          $ref: "#/components/schemas/Amount"
          description: The minimum authorised per-payment amount. Whole Rand, greater than 0.
        max:
          $ref: "#/components/schemas/Amount"
          description:
            The maximum authorised per-payment amount. Whole Rand, greater than `min`, and
            not exceeding 100000.
    PayableNow:
      title: PayableNow
      type: object
      description: An optional immediate first charge taken at sign-up. Not governed by `amountConstraints`.
      x-tags:
        - subscriptions
      required:
        - amount
        - date
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
          description: The once-off charge amount. Must be `ZAR`.
        date:
          type: string
          format: date
          description: The date the once-off charge is taken. Must be today or a future date.
          example: "2035-06-25"
    CreateSubscriptionTransactionRequest:
      title: CreateSubscriptionTransactionRequest
      type: object
      description: The details required to trigger an ad-hoc (manual) charge against an authorised subscription.
      x-tags:
        - subscriptions
      required:
        - amount
        - merchantReference
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
          description: The amount to charge. Must be `ZAR` and within the subscription's authorised band.
        merchantReference:
          type: string
          maxLength: 50
          description: Your unique reference for this charge.
          example: SUB-0001-CHG-05
    SubscriptionResponse:
      title: SubscriptionResponse
      type: object
      description: A subscription resource, returned by create, get and list.
      x-tags:
        - subscriptions
      required:
        - subscriptionId
        - status
        - siteCode
        - amount
        - merchantReference
        - firstPaymentDate
        - occurrences
        - links
      properties:
        subscriptionId:
          type: string
          description: The unique identifier of the subscription.
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        siteCode:
          type: string
          description: The site code the subscription belongs to.
          example: ABC-123456789
        amount:
          $ref: "#/components/schemas/Amount"
          description: The recurring charge amount.
        amountConstraints:
          $ref: "#/components/schemas/AmountConstraints"
          description: The authorised per-payment band. Returned on create and get.
        payableNow:
          $ref: "#/components/schemas/PayableNow"
          description: The once-off sign-up charge. Returned on create only.
        description:
          type: string
          description: The subscription description.
          example: Monthly plan
        merchantReference:
          type: string
          description: Your reference for the subscription.
          example: SUB-0001
        bankReference:
          type: string
          description: >-
            The reference that appears on the merchant's bank statement for each
            payment in the subscription.
          example: MyStore
        frequency:
          $ref: "#/components/schemas/SubscriptionFrequency"
        firstPaymentDate:
          type: string
          format: date
          description: The date of the first scheduled charge.
          example: "2035-07-01"
        occurrences:
          type: integer
          description: The total number of scheduled charges.
          example: 12
        redirectUrl:
          type: string
          format: uri
          description:
            The hosted authorisation page the customer must be redirected to in order to approve
            the subscription. Present while authorisation is pending.
        authorization:
          type: object
          description:
            The customer's authorisation (consent) status. Populated once the customer has
            authorised via `redirectUrl`.
          properties:
            status:
              type: string
              description: The provider-mirrored authorisation status.
        links:
          type: object
          description: Related resource links for the subscription.
          properties:
            self:
              type: string
              format: uri
              description: The URI of this subscription.
            cancel:
              type: string
              format: uri
              description: The URI to cancel this subscription.
            transactions:
              type: string
              format: uri
              description: The URI to create an ad-hoc charge against this subscription.
    SubscriptionTransactionListItem:
      title: SubscriptionTransactionListItem
      type: object
      x-tags:
        - subscriptions
      description:
        One charge instruction under a subscription. Instruction level only, so the
        underlying payment identifiers are not exposed here.
      required:
        - amount
        - merchantReference
      properties:
        amount:
          $ref: "#/components/schemas/Amount"
          description: The currency and amount of the charge.
        merchantReference:
          type: string
          example: "12345-abcde"
          description: The merchant's reference for this individual charge.
        bankReference:
          type: string
          example: "ONLINESHOP002"
          description: >-
            The reference that appears on the merchant's bank statement for this
            charge.
        actionDate:
          type: string
          format: date-time
          description: When the charge is or was due to be actioned.
        isPayableNow:
          type: boolean
          description:
            True when this is the immediate first charge requested with `payableNow` rather
            than a scheduled one.
        createdDate:
          type: string
          format: date-time
          description: When the instruction was created.
    SubscriptionTransactionResponse:
      title: SubscriptionTransactionResponse
      type: object
      description: The result of an ad-hoc charge against a subscription.
      x-tags:
        - subscriptions
      required:
        - transactionId
        - subscriptionId
        - status
        - amount
        - merchantReference
      properties:
        transactionId:
          type: string
          description: The unique identifier of the charge.
          example: "8a1b9f2c-1234-4def-9abc-1234567890ab"
        subscriptionId:
          type: string
          description: The subscription the charge belongs to.
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        status:
          $ref: "#/components/schemas/SubscriptionTransactionStatus"
        amount:
          $ref: "#/components/schemas/Amount"
          description: The charged amount.
        merchantReference:
          type: string
          example: "12345-abcde"
          description: Your reference for this charge.
    SubscriptionFrequency:
      title: SubscriptionFrequency
      type: string
      description: The billing cadence of a subscription.
      x-tags:
        - subscriptions
      enum:
        - Daily
        - Weekly
        - Fortnightly
        - Monthly
        - Biannually
        - Annually
      example: Monthly
    SubscriptionStatus:
      title: SubscriptionStatus
      type: string
      description:
        "The lifecycle status of a subscription:\n  * `PendingAuthorization` - created, awaiting\
        \ customer authorisation via `redirectUrl`.\n  * `Active` - authorised; scheduled charges are\
        \ being taken.\n  * `Canceled` - cancelled; no further charges.\n  * `Completed` - all scheduled\
        \ occurrences have been taken.\n  * `Expired` - the authorisation lapsed before activation.\n\
        \  * `Failed` - the subscription could not be established or sustained.\n  * `Unknown` - the status\
        \ could not be determined."
      x-tags:
        - subscriptions
      enum:
        - PendingAuthorization
        - Active
        - Canceled
        - Completed
        - Expired
        - Failed
        - Unknown
      example: Active
    SubscriptionTransactionStatus:
      title: SubscriptionTransactionStatus
      type: string
      description: The status of an individual subscription charge.
      x-tags:
        - subscriptions
      enum:
        - Pending
        - Successful
        - Failed
      example: Successful
    Amount:
      title: Amount
      type: object
      x-tags:
        - payments
      required:
        - currency
        - value
      properties:
        currency:
          type: string
          description: "The ISO 4217 current code. "
          minLength: 3
          maxLength: 3
          example: ZAR
        value:
          type: number
          format: float
          minimum: 0.01
          description: The amount in the currency specified.
          example: 50
    Error:
      title: Error
      type: object
      description: A standard [JSON API error](https://jsonapi.org/format/#errors)
      x-tags:
        - common
      required:
        - id
        - code
        - title
        - detail
      properties:
        id:
          type: string
          format: uuid
          description: a unique identifier for this particular occurrence of the problem.
        links:
          type:
            - object
            - "null"
          description: Present on an authentication or authorisation failure, and null otherwise.
          properties:
            about:
              type: string
              format: uri
              description:
                A link that leads to further details about this particular occurrence of the
                problem. When dereferenced, this URI SHOULD return a human-readable description of the error.
            type:
              type: string
              format: uri
              description:
                A link that identifies the type of error that this particular error is an instance
                of. This URI SHOULD be dereferenceable to a human-readable explanation of the general error.
        code:
          type: string
          description:
            An application-specific error code, expressed as a string value. Key on this
            rather than on `title` or `detail`, which are written for a person. A rejection at
            the transport level uses the status name, one of `BadRequest`, `Unauthorized`,
            `Forbidden`, `NotFound`, `NotAllowed`, `Conflict`, `UnsupportedMediaType`,
            `BadGateway` or `InternalServerError`. An operation refusing a request on its own
            rules returns a code of its own.
          example: Unauthorized
        title:
          type: string
          description:
            " A short, human-readable summary of the problem that SHOULD NOT change from occurrence
            to occurrence of the problem, except for purposes of localization."
          example: Unauthorized Request
        detail:
          type: string
          description:
            A human-readable explanation specific to this occurrence of the problem. Like title,
            this field’s value can be localized.
          example: Authorization header is missing or invalid.
        source:
          type:
            - object
            - "null"
          description:
            Where in the request the problem was found. All three keys are present whenever
            `source` is, with the ones that do not apply set to null. `source` itself is null
            where the failure is not about a part of the request.
          properties:
            pointer:
              type:
                - string
                - "null"
              format: json-pointer
              description:
                a JSON Pointer [RFC6901](https://tools.ietf.org/html/rfc6901) to the value
                in the request document that caused the error [e.g. "/data" for a primary data object,
                or "/data/attributes/title" for a specific attribute]. This MUST point to a value in
                the request document that exists; if it doesn’t, the client SHOULD simply ignore the
                pointer.
              example: /data
            parameter:
              type:
                - string
                - "null"
              description: A string indicating which URI query parameter caused the error.
              example: id
            header:
              type:
                - string
                - "null"
              description:
                " A string indicating the name of a single request header which caused the
                error."
              example: Authorization
        meta:
          type:
            - object
            - "null"
          description:
            A [meta object](https://jsonapi.org/format/#document-meta) containing non-standard
            meta-information about the error. Null where the request carried no
            `X-Correlation-ID`, and on an authentication failure, which does not echo it.
          properties:
            correlationId:
              type: string
              description:
                The `X-Correlation-ID` sent with the request, echoed back so it can be quoted
                to support. Absent when the request carried no correlation header.
              example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
    Identification:
      title: Identification
      type: object
      x-tags:
        - payments
      required:
        - type
        - country
        - identifier
      properties:
        type:
          enum:
            - said
            - passport
            - registration
            - cellphone
          description: The type of identification for the person or business.
        country:
          type: string
          description: The ISO-3166-alpha-2 identifier for the country of identification.
          example: ZA
          minLength: 2
          maxLength: 2
        identifier:
          type: string
          maxLength: 20
          description: The identifier for the consumer based on the identity type.
          example: "0000000000000"
    InputFieldIFrame:
      title: InputFieldIFrame
      type: object
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          description: The source URL of the iframe to be displayed.
      x-tags:
        - payments
    InputFieldImageCapture:
      title: InputFieldImageCapture
      type: object
      required:
        - base64
      properties:
        base64:
          type: string
          description: The base64 encoded string of the image.
      x-tags:
        - payments
    InputFieldPartialText:
      title: InputFieldPartialText
      type: object
      required:
        - fields
      properties:
        fields:
          type: array
          description: The fields that make up the partial text input field.
          items:
            $ref: "#/components/schemas/InputFieldPartialTextItem"
    InputFieldPartialTextItem:
      title: InputFieldPartialTextItem
      type: object
      properties:
        label:
          type: string
          description: The label of the partial text item.
        defaultValue:
          type: string
          description: The default value of the partial text item.
        maxLength:
          type: integer
          minimum: 1
          description: The max length of the partial text item.
          default: 1
        isDisabled:
          type: boolean
          description: Whether or not this partial text item should be disabled i.e. not allow input.
    InputFieldSelect:
      title: InputFieldSelect
      type: object
      x-tags:
        - payments
      properties:
        options:
          type: array
          items:
            $ref: "#/components/schemas/InputFieldSelectOption"
    InputFieldSelectOption:
      title: InputFieldSelectOption
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: The underlying value of the select option.
        label:
          type: string
          description:
            "The label of the option, this will be a user friendly message that can be displayed
            to the end user. "
        additionalLabel:
          type: string
          description:
            If any additional information is available for the label, this will be a user friendly
            message that can be displayed to the end user.
      x-tags:
        - payments
    InputFieldText:
      title: InputFieldText
      type: object
