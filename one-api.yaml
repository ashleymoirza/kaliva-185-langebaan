          example: "1234567890"
        branchCode:
          type: string
          example: "5040"
          maxLength: 10
          description: The branch code of the account.
    BankAccountVerificationRequest:
      title: BankAccountVerificationRequest
      type: object
      x-tags:
        - bankaccount
      required:
        - siteCode
        - reference
        - region
        - accountNumber
        - branchCode
        - accountType
        - identification
        - surname
      properties:
        siteCode:
          type: string
          maxLength: 50
          example: TSTSTE0001
          description: The site code of the merchant site for which this request is being performed.
        reference:
          type: string
          example: "REF-001"
          description: A reference to uniquely identify this bank account verification request.
          maxLength: 50
        region:
          type: string
          description:
            The applicable region identifier in [ISO 3166-Alpha-2](https://www.iso.org/obp/ui/#search)
            format.
          minLength: 2
          maxLength: 2
          example: ZA
        accountNumber:
          type: string
          example: "0000000000"
          description: The bank account number to be verified.
        branchCode:
          type: string
          example: "000000"
          maxLength: 6
          description: The branch code of the bank account to be verified.
        accountType:
          enum:
            - cheque
            - savings
            - transmission
            - bond
          description: The account type of the bank account.
        identification:
          $ref: "#/components/schemas/Identification"
          description: The identification of the owner of the bank account.
        surname:
