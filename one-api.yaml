openapi: "3.1.0"
tags:
  - name: authentication
    description: Exchange your credentials for the token every other call is made with.
  - name: bankaccount
    x-displayName: Bank account
    description: Look up a bank, and check that an account exists and belongs to who you think.
  - name: bulk
    description: Bulk request related endpoints and models
  - name: Ozow OneAPI
    description: Ozow OneAPI encompassing all REST API integrations possible with Ozow.
  - name: payments
    description: Take a payment, from creating the request to following it to an outcome.
  - name: payouts
    description: Payouts related endpoints and models.
  - name: refunds
    description: Return money from a completed payment, in full or in part.
  - name: settlements
    description: What Ozow has paid into your bank account, and the line items behind it.
  - name: subscriptions
    description: Recurring collections against a mandate the payer authorised once.
  - name: transactions
    description: What happened to a payment, looked up after the fact.
  - name: webhooks
    x-displayName: Webhooks management
    description: Subscribe to events, and replay one your server missed.
  - name: common
    description: Common related endpoints and models
info:
  title: One API
  version: "1.0"
  summary: The One API to rule them all
  description: Ozow OneAPI encompassing all REST API integrations possible with Ozow.
  contact:
    name: Ozow Support
    url: https://ozow.com
    email: support@ozow.com
  termsOfService: https://ozow.com/terms-and-conditions
servers:
  - url: https://one.ozow.com/v1
    description: Production
  - url: https://stagingone.ozow.com/v1
    description: Staging
paths:
  /token:
    post:
      summary: Generate Authentication Token
      tags:
        - authentication
      responses:
        "200":
          description: Successful response as per [RFC 6749](https://datatracker.ietf.org/doc/html/rfc6749#section-5.1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description:
            Unauthorised. A scope in `scope` is not one this client is allowed. Scopes are
            granted per client, so a client can authenticate and still be refused a scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                scopeNotGranted:
                  summary: A requested scope is not granted to this client
                  value:
                    id: 4f7c0d2b-8a15-4e93-b06d-7c2e9f1a5b48
                    links:
                      about: https://ozow.stoplight.io/docs/one-api/zi18vomr0jm8c-generate-authentication-token
                      type: https://tools.ietf.org/html/rfc7235#section-3.1
                    code: Unauthorized
                    title: Unauthorized Request
                    detail: Consumer does not have access to requested scope
                    source:
                      pointer: null
                      parameter: null
                      header: Authorization
                    meta: null
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "404":
          description: Not found. No client matches `client_id`, or the client has been deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                unknownClient:
                  summary: The client id does not resolve
                  value:
                    id: cccb6fb8-505e-4ff9-90b5-815ecf42424e
                    links: null
                    code: NotFound
                    title: Not Found
                    detail: Consumer could not be found for client id YOUR_CLIENT_ID.
                    source:
                      pointer: /data/clientId
                      parameter: /v1/token
                      header: null
                    meta:
                      correlationId: 497f6eca-6276-4993-bfeb-53cbbbba6f08
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-token
      requestBody:
        # Both are accepted and both bind to the same fields. JSON is first
        # because that is what the samples on this operation already send, and
        # form encoding is what RFC 6749 specifies for the client credentials
        # flow, so a merchant arriving with either is right.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      security: []
      description: Retrieve an authentication token as per the [OpenAuth 2.0 Client Credential Flow](https://datatracker.ietf.org/doc/html/rfc6749#section-4.4).
      parameters:
        - $ref: "#/components/parameters/X-Correlation-ID"
  /paymentmethods:
    get:
      summary: Get Payment Methods
      tags:
        - payments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                  - results
                  - meta
                properties:
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                    description: Links for pagination
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethod"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                    description: The pagination meta data available.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-paymentmethods
      parameters:
        - $ref: "#/components/parameters/siteCode-required"
        - $ref: "#/components/parameters/region"
        - $ref: "#/components/parameters/X-Forwarded-For"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/X-Correlation-ID"
      description:
        Retrieve the list of payment methods available.  If  `region` is not specified, IP
        geolocation will be used to determine an applicable region.
      security:
        - Authentication:
            - payments
  /bankaccount/verify:
    post:
      description:
        Confirm a bank account exists, can accept credits, and matches the identity supplied.
        Charged, and must be enabled for the merchant.
      summary: Bank Account Verification
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/BankAccountVerificationResponse"
        "201":
          description: Created
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/BankAccountVerificationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-bankaccount-verify
      tags:
        - bankaccount
      parameters:
        - $ref: "#/components/parameters/X-Correlation-ID"
        - $ref: "#/components/parameters/Idempotency-Key"
      security:
        - Authentication:
            - payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/BankAccountVerificationRequest"
  /regions:
    get:
      summary: Get Regions
      tags:
        - payments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                  - results
                  - meta
                properties:
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                    description: Links for use in pagination.
                  results:
                    type: array
                    description: The list of regions.
                    items:
                      $ref: "#/components/schemas/Region"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                    description: The pagination meta data available.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-regions
      description: Retrieves a list of regions available for payment.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - payments
  /payments:
    post:
      summary: Request Payment
      tags:
        - payments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "201":
          description: Created
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
            Location:
              schema:
                type: string
                format: uri
              description: The unique URI for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/X-Correlation-ID"
      description: Create a payment request with the specified channel and transaction details.
      security:
        - Authentication:
            - payments
    get:
      summary: List Payments
      tags:
        - payments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - links
                  - results
                properties:
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                    description: The links used in pagination.
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentResponse"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-payments
      description: List payments between specific dates.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
        - $ref: "#/components/parameters/siteCode"
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - payments
  /payments/{id}:
    get:
      summary: Get Payment Status by Id
      tags:
        - payments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-payments-id
      description: Retrieves the details of a payment request.
      parameters:
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - payments
    parameters:
      - schema:
          type: string
          format: uuid
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        name: id
        in: path
        required: true
        description: The unique identifier of the payment.
  /payments/{id}/cancel:
    parameters:
      - schema:
          type: string
          format: uuid
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        name: id
        in: path
        required: true
        description: The unique identifier of the payment.
    post:
      summary: Cancel Payment Request
      tags:
        - payments
      responses:
        "200":
          description: OK. The payment has been cancelled.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
          content: {}
        "201":
          description: Created. The payment has been cancelled
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-payments-id-cancel
      description: Cancels the payment request with the specified `id`.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - payments
  /payments/{id}/transactions:
    parameters:
      - schema:
          type: string
          format: uuid
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        name: id
        in: path
        required: true
        description: The unique identifier of the payment.
    get:
      summary: List Transactions for Payment
      tags:
        - payments
      responses:
        "200":
          description: OK.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          description: Bad Request
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-payments-id-transactions
      description:
        List the transactions associated with the payment request with the specified `id`.
        An `id` matching no payment answers 200 with an empty result list rather than 404, so
        check whether a transaction came back rather than reading the status code.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/X-Correlation-ID"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
      security:
        - Authentication:
            - payments
    post:
      description:
        Start a transaction against an existing payment request by supplying the payment details
        directly, rather than redirecting the payer to Ozow. Takes a `paymentType` and the
        `details` object matching it.
      summary: Request Transaction for Payment
      tags:
        - payments
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
                  requiredActionOptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RequiredAction"
        "201":
          description: Created
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    $ref: "#/components/schemas/Transaction"
                  requiredActionOptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/RequiredAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-payments-id-transactions
      parameters:
        - $ref: "#/components/parameters/X-Correlation-ID"
        - $ref: "#/components/parameters/Idempotency-Key"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentDetail"
      security:
        - Authentication:
            - payments
  /refunds:
    get:
      summary: List Refunds
      tags:
        - refunds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundList"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-refunds
      description: Retrieve a list of refunds performed.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/fromDate"
        - $ref: "#/components/parameters/toDate"
        - $ref: "#/components/parameters/siteCode"
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - refunds
    post:
      summary: Request Refunds
      tags:
        - refunds
      responses:
        "200":
          description: OK. The refund has been accepted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refund"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "201":
          description: Created.  The refund has been accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-refunds
      description: Request refunds for the specified transactions.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/X-Correlation-ID"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RefundRequest"
      security:
        - Authentication:
            - refunds
  /refunds/{id}:
    parameters:
      - schema:
          type: string
          format: uuid
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        name: id
        in: path
        required: true
        description: The refund identifier.
    get:
      summary: Get Refund
      tags:
        - refunds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-refunds-id
      description: Retrieve a refund by its unique identifier.
      parameters:
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - refunds
  /refunds/{id}/cancel:
    parameters:
      - schema:
          type: string
          format: uuid
          example: "497f6eca-6276-4993-bfeb-53cbbbba6f08"
        name: id
        in: path
        required: true
        description: The refund identifier.
    post:
      summary: Cancel Refund
      tags:
        - refunds
      responses:
        "200":
          description: OK. The refund has been cancelled.
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "201":
          description: Created.  The refund has been cancelled
          headers:
            X-Correlation-ID:
              schema:
                type: string
                format: uuid
              description: The correlation id for the request that was processed.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: post-refunds-id-cancel
      description: Cancels the refund with the specified identifier if possible.
      parameters:
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/X-Correlation-ID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: The reason for the refund cancellation.
      security:
        - Authentication:
            - refunds
  /refunds/{id}/notifications:
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: The refund identifier.
        example: b1fa5055-19c5-41ab-86dd-15272d103455
    get:
      summary: Get Refund Notifications
      tags:
        - refunds
      responses:
        "200":
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: The correlation id for the request that was processed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookMessageStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: get-refunds-id-notifications
      description: Gets the refund notifications.
      parameters:
        - $ref: "#/components/parameters/X-Correlation-ID"
      security:
        - Authentication:
            - refunds
  /refunds/{id}/notifications/resend:
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: The refund identifier.
        example: b1fa5055-19c5-41ab-86dd-15272d103455
    post:
      summary: Resend Refund Notifications
      tags:
        - refunds
      responses:
        "202":
          description: Accepted.
          headers:
            X-Correlation-ID:
              schema:
                type: string
