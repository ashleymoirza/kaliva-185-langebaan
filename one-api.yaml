          $ref: "#/components/schemas/Amount"
          description: The refund amount.
        requested:
          type: string
          format: date-time
          description: The date and time the refund was requested.
          example: "2026-01-15T09:30:00Z"
        completed:
          type: string
          format: date-time
          description: The date and time the refund was completed.
          example: "2026-01-16T11:04:22Z"
        status:
          enum:
            - Pending
            - Complete
            - Submitted
            - Failed
            - Cancelled
            - Returned
          description:
            "The refund status.  Possible values are:\r\n\r\n\r\n* Pending - The refund request\
            \ has been submitted and accepted.\r\n* Complete - The refund has been paid successfully.\r\
            \n* Submitted - The refund has been assigned to a batch and is being processed.\r\n* Failed\
            \ - The refund payment has failed.\r\n* Cancelled - The refund has been cancelled before it\
            \ was submitted.\r\n* Returned - The refund payment has been returned because the account\
            \ that was being refunded no longer exists.\r\n"
        reason:
          type: string
          example: "Refunded to the payer"
          description: The reason for the status of the refund.
        paidTo:
          $ref: "#/components/schemas/RefundPaidTo"
          description: The bank details of where the refund was paid to.
